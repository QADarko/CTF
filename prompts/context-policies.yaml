version: "1.0"
defaults: &defaults
  version: "1.0"
  allowed_statuses: [CONFIRMED, SELECTED, ACTIVE, COMPLETED, PROPOSED, CANDIDATE]
  include_user_input: false
  include_request_context: true
  include_superseded_history: false
  allow_document_chunks: false
  max_document_chunks: 5
  max_chunk_characters: 4000
  require_explicit_chunk_refs: true
  allowed_request_context_keys: [focus, selected_ids, resource_refs, constraints]
  excluded_resource_kinds: [REALITY_EVENT, EXECUTION_EVENT, DOCUMENT_CHUNK, ATTACHMENT]
  max_resource_items: 20
  evidence_limit: 8
policies:
  REALITY_UPDATE:
    <<: *defaults
    memory_roots: [reality, question, funding_context]
    resource_kinds: [REALITY, QUESTION, EVIDENCE]
    evidence_limit: 6
  QUESTION_REFRAME:
    <<: *defaults
    memory_roots: [reality, question, perception]
    resource_kinds: [REALITY, QUESTION, PERCEPTION]
    evidence_limit: 5
  PERCEPTION_SYNTHESIS:
    <<: *defaults
    memory_roots: [reality, question, perception]
    resource_kinds: [REALITY, QUESTION, PERCEPTION, EVIDENCE]
    evidence_limit: 6
  FUNDING_ENTRY_ROUTING:
    <<: *defaults
    memory_roots: [funding_context, reality]
    resource_kinds: [REALITY]
    evidence_limit: 3
    max_resource_items: 8
  DOCUMENT_ENTRY_ROUTING:
    <<: *defaults
    memory_roots: [document_provenance, reality]
    resource_kinds: [REALITY, EVIDENCE]
    evidence_limit: 4
  CLAIM_EVIDENCE_ASSESSMENT:
    <<: *defaults
    memory_roots: [claims, evidence_ledger, evidence_gaps, reality]
    resource_kinds: [CLAIM, EVIDENCE, EVIDENCE_GAP, REALITY]
    evidence_limit: 12
  DOCUMENT_EVIDENCE_EXTRACTION:
