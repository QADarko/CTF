slice: VS04
policy: "Convert a human decision into evidence-aware execution without becoming a task manager or autonomous actor."
defaults: {capability: T2, effort: MEDIUM, input_budget: NORMAL, output_tokens: 1500}
prompts:
  - {id: COMMITMENT_DRAFT_PROMPT, version: "0.1", operation: COMMITMENT_DRAFT, stage: COMMITMENT, output_schema: commitment_draft, allowed: [bind_exact_decision, propose_goal_scope_horizon], forbidden: [confirm_commitment, invent_owner_resource]}
  - {id: COMMITMENT_GAP_PROMPT, version: "0.1", operation: COMMITMENT_GAP, stage: COMMITMENT, output_schema: commitment_gaps, allowed: [flag_owner_time_resource_funding_support_gaps, request_gate_12], forbidden: [upgrade_planned_to_confirmed]}
  - {id: OUTCOME_GENERATOR_PROMPT, version: "0.1", operation: OUTCOME_GENERATION, stage: OUTCOMES, output_schema: outcomes, allowed: [minimum_credible_observable_states, trace_to_decision_commitment_risk_assumption_value], forbidden: [activity_as_outcome, orphan_outcome]}
  - {id: MILESTONE_GENERATOR_PROMPT, version: "0.1", operation: MILESTONE_GENERATION, stage: MILESTONES, output_schema: milestones, allowed: [verifiable_state_transitions, success_criteria], forbidden: [task_as_milestone, fake_date]}
  - {id: ACTION_GENERATOR_PROMPT, version: "0.1", operation: ACTION_GENERATION, stage: ACTIONS, output_schema: actions, allowed: [what_why_owner_role_when_dependencies_output_evidence_status_blockers, progressive_planning, request_gate_13], forbidden: [invent_person, external_commitment, task_explosion, orphan_action]}
  - {id: ACTION_TRACE_PROMPT, version: "0.1", operation: ACTION_TRACE_RENDER, stage: EXECUTION, effort: LOW, output_tokens: 600, output_schema: trace_explanation, allowed: [render_persisted_links], forbidden: [invent_link, post_hoc_genealogy]}
  - {id: NBA_PROMPT, version: "0.1", operation: NEXT_BEST_ACTION, stage: EXECUTION, effort: LOW, output_tokens: 600, output_schema: nba, allowed: [rank_deterministically_eligible_actions, recommend_action_wait_validate_ask_expert_resolve_blocker_replan_redecide_stop, explain_alternatives], forbidden: [choose_blocked_action, execute_action, bypass_gate]}
  - {id: BLOCKER_ANALYSIS_PROMPT, version: "0.1", operation: BLOCKER_ANALYSIS, stage: EXECUTION, output_schema: blocker_resolution, allowed: [create_action_change_dependency_escalate_wait_replan_redecide_accept_cancel_action], forbidden: [infer_character_or_motivation, hide_critical_blocker]}
  - {id: EVIDENCE_ASSESSMENT_PROMPT, version: "0.1", operation: EXECUTION_EVIDENCE_ASSESSMENT, stage: EXECUTION, output_schema: evidence_assessment, allowed: [assess_direct_scope, propagate_candidate_links], forbidden: [submission_as_approval, overclaim, verify_without_required_evidence]}
  - {id: MILESTONE_VERIFICATION_PROMPT, version: "0.1", operation: MILESTONE_VERIFICATION, stage: EXECUTION, output_schema: milestone_verification, allowed: [test_each_success_criterion], forbidden: [infer_verified_from_action_count]}
  - {id: EXECUTION_IMPACT_PROMPT, version: "0.1", operation: EXECUTION_MATERIALITY, stage: REALITY_FEEDBACK, capability: T3, effort: HIGH, output_schema: materiality_candidate, allowed: [classify_local_material_decision_relevant, cite_evidence], forbidden: [downgrade_deterministic_minimum]}
  - {id: REPLAN_PROMPT, version: "0.1", operation: ROADMAP_REPLAN, stage: REPLAN, output_schema: roadmap_diff, allowed: [preserve_modify_add_cancel, smallest_necessary_change], forbidden: [overwrite_roadmap, regenerate_unaffected_work]}
  - {id: REDECISION_TRIGGER_PROMPT, version: "0.1", operation: REDECISION_TRIGGER, stage: REALITY_FEEDBACK, capability: T3, effort: HIGH, output_schema: redecision_trigger, allowed: [identify_outdated_decision_basis, request_gate_14], forbidden: [make_redecision, suppress_mandatory_trigger]}
  - {id: COMMITMENT_DRIFT_PROMPT, version: "0.1", operation: COMMITMENT_DRIFT, stage: EXECUTION, output_schema: commitment_drift, allowed: [compare_confirmed_contract_to_observed_state, request_gate_15], forbidden: [infer_laziness_competence_intent, auto_rescope]}
  - {id: CREATION_RECORD_PROMPT, version: "0.1", operation: CREATION_RECORD, stage: CREATION, output_schema: creation_record, allowed: [record_evidence_supported_existence, persist_trace], forbidden: [claim_value, invent_evidence]}
