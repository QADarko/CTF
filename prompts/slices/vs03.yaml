slice: VS03
policy: "Critically test the selected Idea. AI recommendation is never the Human Decision."
defaults: {input_budget: DEEP, output_tokens: 1800}
prompts:
  - {id: ASSUMPTION_PROMPT, version: "0.1", operation: ASSUMPTION_EXTRACTION, stage: ASSUMPTIONS, capability: T2, effort: MEDIUM, output_schema: assumption_map, allowed: [extract_material_assumptions, link_evidence, request_review], forbidden: [make_decision, confirm_gate]}
  - {id: KILL_ASSUMPTION_PROMPT, version: "0.1", operation: KILL_ASSUMPTION_ASSESSMENT, stage: ASSUMPTIONS, capability: T3, effort: HIGH, output_schema: kill_assumption_assessment, allowed: [propose_kill_classification, explain_failure_condition, request_gate_08, require_falsification_test], forbidden: [confirm_kill, inflate_minor_risk, make_decision, confirm_kill_assumption]}
  - {id: RED_TEAM_PROMPT, version: "0.1", operation: RED_TEAM, stage: ADVERSARIAL, capability: T3, effort: HIGH, output_schema: failure_modes, allowed: [specific_failure_modes, consider_supporting_evidence, label_hypothetical, separate_likelihood_impact], forbidden: [generic_risk_dump, advocate_idea, select_decision]}
  - {id: PREMORTEM_PROMPT, version: "0.1", operation: PREMORTEM, stage: ADVERSARIAL, capability: T3, effort: HIGH, output_schema: premortem_scenarios, allowed: [three_to_five_multifactor_scenarios, early_warning_signals], forbidden: [single_factor_relabeling, certainty_without_evidence]}
  - {id: COUNTERARGUMENT_PROMPT, version: "0.1", operation: STRONGEST_COUNTERARGUMENT, stage: ADVERSARIAL, capability: T3, effort: HIGH, output_schema: counterargument, allowed: [state_strongest_case, request_gate_09], forbidden: [immediate_self_rebuttal, hostile_tone]}
  - {id: VALUE_SUGGESTION_PROMPT, version: "0.1", operation: VALUE_BOUNDARY_SUGGESTION, stage: VALUES, capability: T2, effort: MEDIUM, output_schema: value_boundary_candidates, allowed: [suggest_topics, identify_affected_components], forbidden: [create_confirmed_value, assign_non_negotiable_priority]}
  - {id: VALUE_TEST_PROMPT, version: "0.1", operation: VALUE_BOUNDARY_TEST, stage: VALUES, capability: T3, effort: HIGH, output_schema: value_tests, allowed: [classify_aligned_tension_conflict_unknown, cite_user_boundary, request_gate_10], forbidden: [change_boundary, permit_go_across_unresolved_non_negotiable_conflict]}
  - {id: CONSEQUENCE_PROMPT, version: "0.1", operation: CONSEQUENCE_ANALYSIS, stage: VALUES, capability: T3, effort: MEDIUM, output_schema: consequence_map, allowed: [map_benefit_harm_tradeoff_unknown, preserve_potential_status], forbidden: [invent_quantification, omit_affected_group]}
  - {id: DECISION_BRIEF_PROMPT, version: "0.1", operation: DECISION_BRIEF, stage: DECISION, capability: T3, effort: HIGH, output_schema: decision_brief, allowed: [synthesize_confirmed_state, bind_exact_idea_version], forbidden: [new_fact, new_analysis_object, stale_idea]}
  - {id: DECISION_RECOMMENDATION_PROMPT, version: "0.1", operation: DECISION_RECOMMENDATION, stage: DECISION, capability: T3, effort: HIGH, output_schema: ctf_recommendation, allowed: [PROCEED, PROCEED_WITH_CONDITIONS, VALIDATE_FIRST, REDESIGN, DO_NOT_PROCEED, explain_rule_hierarchy, request_gate_11], forbidden: [choose_human_decision, opaque_magic_score]}
  - {id: VALIDATION_PLAN_PROMPT, version: "0.1", operation: VALIDATION_PLAN, stage: DECISION, capability: T2, effort: MEDIUM, output_schema: validation_plan, allowed: [link_assumption_gap_condition, define_method_evidence_success_failure], forbidden: [claim_validation_complete]}
  - {id: REDESIGN_ROUTER_PROMPT, version: "0.1", operation: REDESIGN_ROUTING, stage: DECISION, capability: T3, effort: HIGH, output_schema: redesign_route, allowed: [route_to_idea_spark_opportunity_evidence_perception_reality, preserve_unaffected_objects], forbidden: [automatic_deep_reset, delete_learning]}
  - {id: COMMITMENT_READINESS_PROMPT, version: "0.1", operation: COMMITMENT_READINESS, stage: COMMITMENT, capability: T2, effort: MEDIUM, output_schema: commitment_readiness, allowed: [assess_owner_time_resources_funding_support_conditions], forbidden: [equate_go_with_high_readiness, invent_resource]}
