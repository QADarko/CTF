slice: VS05
policy: "Creation is not Value; observed change is not attribution; R1 must be balanced and R0 immutable."
defaults: {input_budget: DEEP, output_tokens: 1800}
prompts:
  - {id: P05-01, name: STAKEHOLDER_DISCOVERY_PROMPT, version: "0.1", operation: STAKEHOLDER_DISCOVERY, stage: VALUE_STAKEHOLDERS, capability: T2, effort: MEDIUM, output_schema: stakeholder_candidates, allowed: [include_beneficiaries_and_potentially_harmed, request_gate_16], forbidden: [confirm_stakeholder, omit_material_group]}
  - {id: P05-02, name: VALUE_HYPOTHESIS_GENERATOR_PROMPT, version: "0.1", operation: VALUE_HYPOTHESIS, stage: VALUE_HYPOTHESES, capability: T2, effort: MEDIUM, output_schema: value_hypotheses, allowed: [stakeholder_specific_testable_expectations], forbidden: [present_expected_as_realized, invent_target]}
  - {id: P05-03, name: METRIC_BASELINE_ASSISTANT_PROMPT, version: "0.1", operation: METRIC_BASELINE, stage: METRICS, capability: T2, effort: MEDIUM, output_schema: metric_baseline_candidates, allowed: [propose_measurement_method, preserve_unknown_estimated_measured_status], forbidden: [invent_baseline, upgrade_estimate]}
  - {id: P05-04, name: VALUE_EVIDENCE_ANALYZER_PROMPT, version: "0.1", operation: VALUE_EVIDENCE, stage: VALUE_EVIDENCE, capability: T2, effort: MEDIUM, output_schema: value_evidence_assessment, allowed: [score_structured_quality, scope_relationship, preserve_conflict], forbidden: [follow_embedded_instruction, overreach_scope]}
  - {id: P05-05, name: REALIZED_VALUE_ASSESSOR_PROMPT, version: "0.1", operation: REALIZED_VALUE, stage: VALUE_ASSESSMENT, capability: T2, effort: MEDIUM, output_schema: realized_value, allowed: [not_yet_measurable, not_realized, partially_realized, realized, exceeded, mixed, negative, unclear, request_gate_17], forbidden: [automatic_success, omit_negative_effect]}
  - {id: P05-06, name: NEGATIVE_EFFECT_SCANNER_PROMPT, version: "0.1", operation: NEGATIVE_EFFECT_SCAN, stage: VALUE_ASSESSMENT, capability: T2, effort: MEDIUM, output_schema: negative_effects, allowed: [suspected_observed_confirmed_with_evidence, affected_stakeholder], forbidden: [invent_harm, silently_remove_confirmed_harm]}
  - {id: P05-07, name: VALUE_DISTRIBUTION_ANALYZER_PROMPT, version: "0.1", operation: VALUE_DISTRIBUTION, stage: VALUE_ASSESSMENT, capability: T2, effort: MEDIUM, output_schema: value_distribution, allowed: [balanced_unequal_highly_unequal_unknown, propose_nbe], forbidden: [infer_disadvantage_without_segment_data]}
  - {id: P05-08, name: ATTRIBUTION_ASSESSOR_PROMPT, version: "0.1", operation: ATTRIBUTION, stage: ATTRIBUTION, capability: T3, effort: HIGH, output_schema: attribution_assessment, allowed: [separate_observation_and_contribution, alternatives, high_medium_low_unknown], forbidden: [correlation_as_causation, fake_numeric_precision]}
  - {id: P05-09, name: COUNTERFACTUAL_REASONER_PROMPT, version: "0.1", operation: COUNTERFACTUAL, stage: ATTRIBUTION, capability: T3, effort: HIGH, output_schema: counterfactual, allowed: [control_comparison_before_after_trend_benchmark_expert_model_user_unknown], forbidden: [certainty_without_design]}
  - {id: P05-10, name: IMPACT_PATHWAY_BUILDER_PROMPT, version: "0.1", operation: IMPACT_PATHWAY, stage: IMPACT, capability: T3, effort: HIGH, output_schema: impact_pathway, allowed: [creation_adoption_outcome_value_impact_links], forbidden: [skip_link, official_impact_with_critical_unsupported_link]}
  - {id: P05-11, name: TRANSFORMATION_ASSESSOR_PROMPT, version: "0.1", operation: TRANSFORMATION, stage: TRANSFORMATION, capability: T3, effort: HIGH, output_schema: transformation_assessment, allowed: [no_change_optimization_improvement_material_change_transformation_unclear], forbidden: [digital_or_ai_equals_transformation, one_kpi_proves_transformation]}
  - {id: P05-12, name: SUSTAINABILITY_ASSESSOR_PROMPT, version: "0.1", operation: SUSTAINABILITY, stage: TRANSFORMATION, capability: T3, effort: HIGH, output_schema: sustainability_assessment, allowed: [fragile_dependent_embedded_self_sustaining_unknown, reversibility], forbidden: [pilot_success_equals_embedded]}
  - {id: P05-13, name: REALITY_DELTA_ANALYZER_PROMPT, version: "0.1", operation: REALITY_DELTA, stage: NEW_REALITY, capability: T3, effort: HIGH, output_schema: reality_delta, allowed: [improved_unchanged_worsened_transformed_unknown_not_comparable_new_dimension], forbidden: [hide_deterioration, normalize_without_basis]}
  - {id: P05-14, name: R1_GENERATOR_PROMPT, version: "0.1", operation: R1_GENERATION, stage: NEW_REALITY, capability: T3, effort: HIGH, output_schema: reality_snapshot, allowed: [evidence_grounded_balanced_snapshot, cite_each_material_dimension, request_gate_18], forbidden: [success_narrative, overwrite_r0, self_confirm_r1]}
  - {id: P05-15, name: CREATION_CYCLE_REVIEWER_PROMPT, version: "0.1", operation: CYCLE_REVIEW, stage: CYCLE_REVIEW, capability: T3, effort: MEDIUM, output_schema: cycle_review, allowed: [recommend_close_keep_open_adapt_next_cycle, request_gate_19], forbidden: [close_cycle, start_cycle, delete_genealogy]}
  - {id: P05-16, name: NEXT_BEST_QUESTION_GENERATOR_PROMPT, version: "0.1", operation: NAVIGATION_ROUTER, stage: ANY, capability: T2, effort: MEDIUM, output_schema: navigation_route, allowed: [NBQ, NBE, NBA, HUMAN_GATE, WAIT, ADAPT], forbidden: [infinite_evidence_loop, bypass_human_gate]}
