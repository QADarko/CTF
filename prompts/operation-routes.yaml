# Canonical routing registry for all 55 CTF AI operations (CTF-ROUTING-01).
# Prompt Registry, ModelRouter, ConsequentialityEngine, evaluation, and Model Registry
# must read from this file. Unknown operations fail closed: AI_OPERATION_ROUTE_NOT_DEFINED.
version: "1.0"
defaults:
  T1:
    capability: EFFICIENT_AI
    minimum_consequentiality: LOW
    reasoning_effort: NONE
    max_input_tokens: 4000
    max_output_tokens: 250
    human_review_requirement: false
  T2:
    capability: STANDARD_REASONING
    minimum_consequentiality: MEDIUM
    reasoning_effort: MEDIUM
    max_input_tokens: 16000
    max_output_tokens: 1500
    human_review_requirement: false
  T3:
    capability: CRITICAL_REASONING
    minimum_consequentiality: CRITICAL
    reasoning_effort: HIGH
    max_input_tokens: 24000
    max_output_tokens: 1800
    human_review_requirement: true
aliases:
  CLASSIFICATION: DOCUMENT_ENTRY_ROUTING
  CLAIM_EXTRACTION: DOCUMENT_EVIDENCE_EXTRACTION
  REALITY: REALITY_UPDATE
  QUESTION: QUESTION_REFRAME
  PERCEPTION: PERCEPTION_SYNTHESIS
  OPPORTUNITY: OPPORTUNITY_GENERATION
  SPARK: SPARK_GENERATION
  IDEA: IDEA_BLUEPRINT
  ROADMAP: ROADMAP_REPLAN
  NBA: NEXT_BEST_ACTION
  VALUE_ASSESSMENT: REALIZED_VALUE
  TRANSFORMATION_ASSESSMENT: TRANSFORMATION
