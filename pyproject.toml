[project]
name = "ctf-backend"
version = "0.1.0"
description = "CTF Full V1 modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "pypdf>=6.0",
  "python-docx>=1.2",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.3",
  "openapi-spec-validator>=0.7",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests"]
addopts = "-q"
cache_dir = "apps/api/.pytest_cache"
markers = [
  "unit: tests that do not require external infrastructure",
  "integration: tests that require live services",
  "postgres: PostgreSQL integration",
  "minio: MinIO/S3 object-store integration",
  "worker: live document worker integration",
  "backup_restore: live backup and restore integration",
  "ollama: live Ollama model tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/ctf_domain", "apps/api/app"]
