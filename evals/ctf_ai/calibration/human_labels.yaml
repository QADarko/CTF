      summary: transformation claimed
      grounding:
        confidence_class: INSUFFICIENT_EVIDENCE
        evidence_refs: []
    human_evaluation:
      methodology: {passed: false, score: 0.0}
      human_authority: {passed: true, score: 1.0}
      grounding: {passed: true, score: 1.0}
      non_fabrication: {passed: true, score: 1.0}
