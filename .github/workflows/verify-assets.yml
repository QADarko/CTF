name: CTF full CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: ""
      AI_API_KEY: ""
      CTF_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest --junitxml=golden/pytest.xml
      - name: SQLite persistence suite
        run: pytest apps/api/tests/test_persistence.py --junitxml=golden/persistence.xml
      - name: Execute golden release gate
        run: python golden/run.py --json-report golden/report.json --junit-report golden/junit.xml
      - name: Verify registry, execution metadata, and assets
        run: python tests/verify_assets.py
      - name: Validate OpenAPI 3.1 contract
        run: openapi-spec-validator docs/openapi.yaml
      - name: Structural AI golden evaluation
        run: python -m evals.ctf_ai.runner --provider structural --report evals/ctf_ai/results/latest.json

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ctf_test
          POSTGRES_USER: ctf
          POSTGRES_PASSWORD: ctf-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctf -d ctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CTF_TEST_POSTGRES_URL: postgresql+psycopg://ctf:ctf-test@localhost:5432/ctf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - run: pytest apps/api/tests/test_postgres_integration.py apps/api/tests/test_postgres_job_queue.py -q

  minio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: ctf
          MINIO_ROOT_PASSWORD: ctf-test-password
        ports:
          - 9000:9000
        options: --health-cmd "true" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      CTF_OBJECT_STORE: minio
      CTF_BUCKET: ctf-private
      S3_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: ctf
      MINIO_ROOT_PASSWORD: ctf-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready" >&2
          exit 1
      - name: Create private bucket
        run: |
          docker run --rm --network host minio/mc:latest sh -ec "mc alias set ctf http://localhost:9000 ctf ctf-test-password && mc mb --ignore-existing ctf/ctf-private && mc anonymous set none ctf/ctf-private"
      - run: pytest apps/api/tests/test_object_store_integration.py -q
      - name: Upload Python and golden reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-golden-reports
          path: |
            golden/pytest.xml
            golden/persistence.xml
            golden/junit.xml
            golden/report.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CTF_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_USE_MOCKS: "true"
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: fake
      NEXT_PUBLIC_USE_MOCKS: "false"
      NEXT_PUBLIC_CTF_API_URL: http://127.0.0.1:8080/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Start API
        run: python -m uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8080 &
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npm run build
      - name: Start web
        working-directory: apps/web
        run: npx next start -H 127.0.0.1 -p 3000 &
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && curl -sf http://127.0.0.1:3000 >/dev/null && exit 0; sleep 2; done
          exit 1
      - working-directory: apps/web
        run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          MINIO_ROOT_USER: ci-user
          MINIO_ROOT_PASSWORD: ci-password-not-a-secret
        run: docker compose config --quiet
      - name: Reject tracked local secrets
        shell: bash
        run: |
          test ! -f .env
          ! git grep -nE '(AI_API_KEY|KHAL_READONLY_TOKEN)=[^[:space:]]+' -- ':!*.example'
