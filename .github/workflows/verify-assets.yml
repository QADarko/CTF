name: CTF full CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: ""
      AI_API_KEY: ""
      CTF_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest --junitxml=golden/pytest.xml
      - name: SQLite persistence suite
        run: pytest apps/api/tests/test_persistence.py --junitxml=golden/persistence.xml
      - name: Execute golden release gate
        run: python golden/run.py --json-report golden/report.json --junit-report golden/junit.xml
      - name: Verify registry, execution metadata, and assets
        run: python tests/verify_assets.py
      - name: Validate OpenAPI 3.1 contract
        run: openapi-spec-validator docs/openapi.yaml
      - name: Upload Python and golden reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-golden-reports
          path: |
            golden/pytest.xml
            golden/persistence.xml
            golden/junit.xml
            golden/report.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CTF_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_USE_MOCKS: "true"
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          MINIO_ROOT_USER: ci-user
          MINIO_ROOT_PASSWORD: ci-password-not-a-secret
        run: docker compose config --quiet
      - name: Reject tracked local secrets
        shell: bash
        run: |
          test ! -f .env
          ! git grep -nE '(AI_API_KEY|KHAL_READONLY_TOKEN)=[^[:space:]]+' -- ':!*.example'
