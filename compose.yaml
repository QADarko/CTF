name: ctf-v1

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctf}
      POSTGRES_USER: ${POSTGRES_USER:-ctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [ctf-internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [ctf-internal]

  clamav:
    image: clamav/clamav:1.4.2
    restart: unless-stopped
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [ctf-internal]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      CTF_BUCKET: ${CTF_BUCKET:-ctf-private}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set ctf http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "ctf/$${CTF_BUCKET}"
        mc anonymous set none "ctf/$${CTF_BUCKET}"
    networks: [ctf-internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      CTF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ctf}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ctf}
      CTF_DOCUMENT_QUEUE: postgres
      CTF_OBJECT_STORE: minio
      CTF_BUCKET: ${CTF_BUCKET:-ctf-private}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CTF_MALWARE_SCANNER: ${CTF_MALWARE_SCANNER:-clamav}
      CTF_ENFORCE_MODEL_REGISTRY: ${CTF_ENFORCE_MODEL_REGISTRY:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MODEL_MAP: ${AI_MODEL_MAP:-{}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_MODEL_MAP: ${OLLAMA_MODEL_MAP:-{}}
      AI_LOCAL_ALLOW_T3: ${AI_LOCAL_ALLOW_T3:-false}
      AI_LOCAL_ALLOW_T4: ${AI_LOCAL_ALLOW_T4:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ctf-internal]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: python -m apps.worker.main
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      CTF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ctf}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ctf}
      CTF_DOCUMENT_QUEUE: postgres
      CTF_OBJECT_STORE: minio
      CTF_BUCKET: ${CTF_BUCKET:-ctf-private}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CTF_MALWARE_SCANNER: ${CTF_MALWARE_SCANNER:-clamav}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CTF_WORKER_POLL_SECONDS: ${CTF_WORKER_POLL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks: [ctf-internal]

  ollama:
    image: ollama/ollama:latest
    profiles: [local-ai]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [ctf-internal]

  ollama-init:
    image: ollama/ollama:latest
    profiles: [local-ai]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL_T1: ${OLLAMA_MODEL_T1:-qwen2.5:3b}
      OLLAMA_MODEL_T2: ${OLLAMA_MODEL_T2:-qwen2.5:7b}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ollama pull "$${OLLAMA_MODEL_T1}"
        if [ "$${OLLAMA_MODEL_T2}" != "$${OLLAMA_MODEL_T1}" ]; then
          ollama pull "$${OLLAMA_MODEL_T2}"
        fi
    networks: [ctf-internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CTF_API_URL: ${NEXT_PUBLIC_CTF_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [ctf-internal]

volumes:
  postgres-data:
  minio-data:
  ollama-data:

networks:
  ctf-internal:
    driver: bridge
